name: PGS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pgs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify source, tests, build and package boundary
        run: npm run check
      - name: Generate deterministic evaluation artifacts
        run: npm run artifacts:ci
      - name: Upload evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pgs-fidelity-evaluation
          path: artifacts/ci/*.json
          if-no-files-found: error
          retention-days: 14
