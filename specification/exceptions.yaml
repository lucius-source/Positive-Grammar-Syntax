version: 0.1.0
status: draft
system: Positive Grammar Syntax

exceptions:
  - id: EXC-001
    name: necessary_factual_negation
    protects: [PGS-003, PGS-007]
    examples: ["The payment was not received.", "The claimant did not serve the notice."]
    rule: Preserve negation when removing it would alter the asserted fact.

  - id: EXC-002
    name: safety_critical_prohibition
    protects: [PGS-003, PGS-007]
    examples: ["Do not energise the circuit.", "This medicine must not be combined with X."]
    rule: Preserve explicit prohibition where it communicates a material safety boundary.

  - id: EXC-003
    name: legal_denial_or_rebuttal
    protects: [PGS-003, PGS-007]
    rule: Preserve denials, non-admissions, reservations, exceptions and operative negatives whose alteration may change legal meaning.

  - id: EXC-004
    name: unknown_actor
    protects: [PGS-001]
    rule: Flag missing material agency but never fabricate an actor.

  - id: EXC-005
    name: intentional_temporal_flexibility
    protects: [PGS-004]
    rule: Preserve flexible timing when flexibility is intentional or exact timing is unavailable; never invent a date or deadline.

  - id: EXC-006
    name: attributed_or_quoted_claim
    protects: [PGS-002, PGS-005]
    rule: Preserve the speaker's proposition when accurately quoting or attributing it; analysis may separately classify its epistemic status.

  - id: EXC-007
    name: descriptive_non_actionable_communication
    protects: [PGS-006]
    rule: Do not force a request or action into communication whose purpose is purely descriptive, expressive, historical or creative.

  - id: EXC-008
    name: instrument_operative_text
    applies_to: l3_generation
    accepted: 2026-10-30
    scope: generation_only
    detection_bias: withhold_when_uncertain
    rule: >
      Do not generate, propose or render replacement wording for the operative
      text of a legal instrument. Analysis, scoring, explanation and fidelity
      comparison of such text remain fully available; only generation is
      withheld, and the withholding is reported with the markers that caused it.
    rationale: >
      EXC-104 already requires verified domain fidelity for operative language.
      This is stronger and narrower: for an instrument, generation is withheld
      outright rather than permitted subject to verification. A clause does not
      merely describe a disposition, it effects one, so a wording that survives
      fidelity comparison may still alter what the instrument does. The costs
      are asymmetric — withholding costs a drafter their own wording, a wrong
      generation costs an instrument that does not do what its maker intended —
      and that asymmetry, not detector confidence, sets the default.
    examples:
      - "IN WITNESS WHEREOF the parties have executed this Deed."
      - "The Settlor hereby declares that the Trustees shall hold the Trust Fund upon trust for the Beneficiaries."
      - "NOW THEREFORE in consideration of the premises the parties agree as follows."
    counterexamples:
      - "I do not consent to this."
      - "Your notice of 14 November arrived after the deadline it sets."
      - "I am writing about the agreement we signed last year."
      - "The trustee has not replied to either of my letters."

  - id: EXC-009
    name: verified_double_negation
    protects: [PGS-003, PGS-007]
    amends: EXC-001
    accepted: 2026-10-30
    rule: >
      Negation may be removed when its removal is VERIFIED not to alter the
      asserted fact. Verification is structural and deterministic: the negation
      parity of source and candidate must match, their propositions must carry
      the same actor, action and object, and neither may contain a
      scope-sensitive quantifier. Anything unverified stays blocked.
    rationale: >
      EXC-001 has always been conditional — "preserve negation WHEN removing it
      would alter the asserted fact" — but the comparator read it as absolute
      and refused every removal. The cost of that is not abstract: "I did not
      fail to send it." cannot become "I sent it.", so PGS-003 Affirmative
      Outcome and PGS-007 Constructive Negation, two of the seven rules, could
      not be exercised at all on the sentences that most need them.
      This does not weaken EXC-001. It implements the condition EXC-001 always
      carried, and refuses to certify wherever the condition cannot be checked.
    verification:
      parity: Count explicit negation markers and inherently negative verbs; the counts must agree modulo two.
      core: Both sides must expose a single proposition with the same actor, action and object. An action PGS cannot see is not a verified one.
      scope_guard: Refuse when either side contains not-all, not-every, not-any, not-both, or an all/every/each separated from a negation — parity is not sufficient under quantifier scope.
      outcome: review_required, never pass. Structural verification is evidence, not a semantic guarantee.
    negative_verbs: [fail, neglect, omit, forget]
    examples:
      - ["I did not fail to send it.", "I sent it."]
      - ["They neglected to tell me.", "They did not tell me."]
    counterexamples:
      # Not refusing is not doing: "refuse" is deliberately absent from
      # negative_verbs, because refusal is not sentential negation.
      - ["I did not refuse to attend.", "I attended."]
      - ["I have not received the payment.", "I received the payment."]
      - ["Not all balances are addressed.", "All balances are unaddressed."]

  - id: EXC-101
    name: clear_pronoun_reference
    domain: PGS-A
    applies_to: PAT-101
    evidence_status: research
    rule: Do not replace pronouns mechanically when the antecedent is clear and repetition would reduce naturalness without improving precision.

  - id: EXC-102
    name: legitimate_past_or_future_reference
    domain: PGS-D
    applies_to: PAT-104
    evidence_status: research
    rule: Past and future tense may accurately describe time, evidence, obligation, prediction or intention; tense alone must not be treated as semantic, factual or legal invalidity.

  - id: EXC-103
    name: lexical_false_decomposition
    domain: PGS-E
    applies_to: [PAT-105, PAT-106]
    evidence_status: research
    rule: Do not infer meaning from visually convenient segmentation where morphology, etymology, usage or context does not support the decomposition.

  - id: EXC-104
    name: domain_specific_operative_language
    domains: [PGS-D, PGS-E]
    rule: In legal, medical, scientific, technical and safety text, preserve terms of art and operative language unless a transformation is verified not to change domain meaning.

  - id: EXC-105
    name: creative_expression
    domains: [PGS-A, PGS-B, PGS-C, PGS-D, PGS-E]
    rule: Metaphor, humour, poetry, dialogue and deliberate ambiguity may be intentional. Analyse according to selected mode before applying comprehensive transformation.
